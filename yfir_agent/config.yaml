name: yfir agent
# The release workflow stamps the tag here; it is also the image tag Home Assistant pulls.
version: "v0.6.0"
slug: yfir_agent
description: Reports this host to a yfir hub, observing only
url: https://github.com/twish/yfir
image: ghcr.io/twish/yfir-agent
arch:
  - aarch64
  - amd64
init: true
startup: services
boot: auto
host_network: true
host_uts: true
host_pid: true
journald: true
docker_api: true
options:
  hub: ""
  token: ""
  tls_fingerprint: ""
schema:
  hub: str
  token: password?
  tls_fingerprint: str?
